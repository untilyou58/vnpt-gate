# Cấu hình cấp bộ công cụ. Dự án ghi đè bằng .vnptnan-gate/gate.conf; biến môi trường GATE_* ghi đè tất cả.
# MODE: enforce (từ chối commit/push vi phạm mức block) | audit (chỉ ghi log; dùng trong 2 tuần thí điểm)
MODE=enforce
# DEPS: block | warn | off  — mức tối đa cho phát hiện về dependency/giấy phép
DEPS=warn
# DEPS_AUDIT: 1 = chạy npm audit / dotnet list package --vulnerable (cần mạng, chậm); mặc định tắt trong hook, bật trong CI
DEPS_AUDIT=0
# DEPS_LICENSE: off | known | all — kiểm giấy phép package. off (mặc định): không kiểm.
#   known: chỉ báo package có giấy phép đọc được và nằm trong rules/packages.rules (GPL, AGPL, LGPL...).
#   all: báo thêm package không rõ giấy phép (nhiều package cũ chỉ khai licenseUrl hoặc file LICENSE, nên báo nhiều).
DEPS_LICENSE=off
# Số commit tối đa quét trong một lần push
MAX_COMMITS=500
# File lớn hơn (bytes) không quét theo dòng
MAX_FILE=5242880
# SKIP_PATHS_EXTRA: regex đường dẫn thêm vào danh sách bỏ qua mặc định (thường đặt trong .vnptnan-gate/gate.conf của dự án)
#SKIP_PATHS_EXTRA=(^|/)legacy-dump/
