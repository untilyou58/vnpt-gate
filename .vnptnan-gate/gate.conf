# Cấu hình gate cho chính repo VNPTNAN_GATE: file rule và ca kiểm thử chứa các mẫu secret giả, không quét theo dòng.
# SKIP_PATHS_EXTRA được nối thêm vào danh sách bỏ qua mặc định (node_modules, bin, obj, .vnptnan-gate/ ...).
SKIP_PATHS_EXTRA=(^|/)rules/[^/]+\.rules$|(^|/)rules/gitleaks\.(jsonl|pldata)$|(^|/)tests/(cases|prompt-cases)\.tsv$|(^|/)docs/.*\.(md|docx)$
