# Kiểm thử mỗi lần push/PR, và là bước bắt buộc trước khi release.yml phát hành.
# Job windows cài thật trên máy Windows của GitHub: file setup.cmd, hook git chặn secret, lệnh npm setup/status/uninstall.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cấu hình git cho test
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: Lint rule
        run: bash tools/lint-rules.sh
      - name: Cài pypdf cho kiểm thử gateway (cùng phiên bản với Dockerfile)
        run: python3 -m pip install --user --break-system-packages --no-deps pypdf==6.17.0
      - name: Kiểm thử (rule, hook, pre-receive, prompt)
        run: bash tests/run-tests.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Đóng gói (npm + file cài một-file)
        run: |
          bash tools/build-npm.sh
          bash tools/build-package.sh
          node dist/npm/bin/cli.js version
      - name: Cài thật trên Linux qua npx (tài khoản thường, không sudo)
        shell: bash
        run: |
          set -euo pipefail
          tgz=$(ls dist/vnptnan-gate-*.tgz)
          npx -y --package="$PWD/$tgz" vnptnan-gate-setup --hooks-path
          export PATH="$HOME/.local/bin:$PATH"
          vnptnan-gate version
          d=$(mktemp -d) && cd "$d" && git init -q
          k=AKIA; k="${k}IOSFODNN7ABCDXYZ"   # ghép lúc chạy để chính file này không chứa khoá mẫu
          echo "aws_key = \"$k\"" > leak.txt && git add leak.txt
          # chính sách phát hành có thể là audit: hook phải chạy và ghi phát hiện, chặn hay không tuỳ chế độ
          out=$(git commit -qm thu 2>&1 || true); echo "$out"
          echo "$out" | grep -q 'g-secret-aws' || { echo "hook qua core.hooksPath không chạy"; exit 1; }
          # Git >= 2.54 (máy CI): hook theo config cấp người dùng; Git cũ hơn: core.hooksPath (--hooks-path)
          d=$(vnptnan-gate doctor 2>&1 || true); echo "$d"
          grep -qE 'hook (cấp người dùng|cấp máy|qua core.hooksPath)' <<< "$d" || { echo "doctor không thấy hook"; exit 1; }
          vnptnan-gate scan tree . || true
          ls .vnptnan-gate/reports/moi-nhat.html
          st=$(node "$(ls -d ~/.local/share/vnptnan-gate/current)/bin/cli.js" status 2>&1 || true); echo "$st"
          grep -qE 'Hook +: (git config --global hook|core.hooksPath)' <<< "$st" || { echo "status không thấy hook"; exit 1; }
          npx -y --package="$GITHUB_WORKSPACE/$tgz" vnptnan-gate-setup uninstall
          [ ! -e "$HOME/.local/bin/vnptnan-gate" ] && [ -z "$(git config --global --get core.hooksPath || true)" ] \
            && [ -z "$(git config --global --get-regexp '^hook\.vnptnan-gate' || true)" ] || { echo "gỡ chưa sạch"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tgz
            dist/*.cmd
            dist/*.zip
            dist/SHA256SUMS.txt

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Cài bằng file setup.cmd (enforce)
        shell: cmd
        run: |
          for %%f in (dist\VNPTNAN_GATE-*-setup.cmd) do call "%%f"
          if errorlevel 1 exit /b 1
      - name: Hook chặn secret, cho qua commit sạch
        shell: pwsh
        run: |
          $cli = "$env:ProgramData\VNPTNAN_GATE\current\cli\vnptnan-gate.cmd"
          if (-not (Test-Path $cli)) { throw "Chưa cài: thiếu $cli" }
          git --version
          $t = Join-Path $env:RUNNER_TEMP 'repo'; git init -q $t; Set-Location $t
          git config user.email t@example.invalid; git config user.name t
          if (-not (git config --system --get hook.vnptnan-gate-commit.event)) {
            Write-Warning 'Git < 2.54: không có hook cấp máy, dùng install-hooks cho repo'
            & $cli install-hooks
          }
          'AWS_KEY=AKIAIOSFODNN7EXAMPLE' | Out-File -Encoding ascii leak.txt
          git add leak.txt
          git commit -q -m leak 2>&1 | Write-Host
          if ($LASTEXITCODE -eq 0) { throw 'pre-commit KHÔNG chặn secret' }
          git reset -q
          '# ok' | Out-File -Encoding ascii ok.md
          git add ok.md
          git commit -q -m ok
          if ($LASTEXITCODE -ne 0) { throw 'commit sạch bị chặn' }
          & $cli doctor; "doctor rc=$LASTEXITCODE"
          Write-Host 'Hook trên Windows: đạt'
      - name: Gỡ bản setup.cmd
        shell: pwsh
        run: |
          $u = Join-Path $env:RUNNER_TEMP 'uninstall.ps1'
          Copy-Item "$env:ProgramData\VNPTNAN_GATE\current\installer\uninstall.ps1" $u
          powershell -NoProfile -ExecutionPolicy Bypass -File $u
          if (Test-Path "$env:ProgramData\VNPTNAN_GATE\current") { throw 'gỡ chưa sạch' }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npx setup / status / uninstall (đúng như dev gõ, gói nằm trong cache npx\node_modules)
        shell: pwsh
        run: |
          # Gõ từng lệnh npx đầy đủ: npx.ps1 trên Windows đọc lại nguyên dòng lệnh ($MyInvocation.Line),
          # gọi qua biến scriptblock với @args sẽ làm mất tham số.
          $tgz = (Get-Item dist\vnptnan-gate-*.tgz).FullName
          npx -y --package=$tgz vnptnan-gate-setup setup --enforce
          if ($LASTEXITCODE -ne 0) { throw 'npx setup lỗi' }
          if (-not (Test-Path "$env:ProgramData\VNPTNAN_GATE\current\cli\vnptnan-gate.cmd")) { throw 'npx setup không cài được file' }
          $mode = (Get-Content "$env:ProgramData\VNPTNAN_GATE\current\gate.conf" | Select-String '^MODE=(\w+)').Matches[0].Groups[1].Value
          if ($mode -ne 'enforce') { throw "tham số --enforce không tới được gói (MODE=$mode)" }
          schtasks /Query /TN 'VNPTNAN_GATE Update' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'không có lịch tự cập nhật' }
          $st = npx -y --package=$tgz vnptnan-gate-setup status | Out-String
          Write-Host $st
          if ($st -notmatch 'Lịch cập nhật') { throw 'lệnh status không chạy (tham số bị mất)' }
          npx -y --package=$tgz vnptnan-gate-setup uninstall
          if (Test-Path "$env:ProgramData\VNPTNAN_GATE\current") { throw 'gỡ chưa sạch' }
          schtasks /Query /TN 'VNPTNAN_GATE Update' 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'lịch cập nhật còn sau khi gỡ' }
          $global:LASTEXITCODE = 0
          Write-Host 'Cài/gỡ qua npx trên Windows: đạt'
